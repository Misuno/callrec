[package]
name = "callrec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
pipewire = "0.10.1"
ratatui = "0.30.2"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Losing a recording is the main risk: no hidden panics in runtime code.
# Tests may use unwrap/expect (see clippy.toml).
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_stack_arrays = "warn"

[dev-dependencies]
tempfile = "3.27.0"
